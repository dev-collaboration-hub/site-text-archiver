<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Site Text Archiver</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app-shell">
    <header>
      <h1>Site Text Archiver</h1>
      <p class="subtitle">M2 crawl queue and state machine</p>
    </header>

    <form id="settings-form" novalidate>
      <label>Start URL<input id="start-url" name="startUrl" type="url" required></label>
      <label>Allowed origin<input id="allowed-origin" name="allowedOrigin" type="url" required></label>
      <label>Allowed path<input id="allowed-path" name="allowedPathPrefix" type="text" value="/" required></label>

      <div class="grid">
        <label>Max pages<input id="max-pages" name="maxPages" type="number" min="1" max="10000"></label>
        <label>Max depth<input id="max-depth" name="maxDepth" type="number" min="0" max="100"></label>
        <label>Delay ms<input id="request-delay" name="requestDelayMs" type="number" min="0" max="60000"></label>
        <label>Retries<input id="retry-limit" name="retryLimit" type="number" min="0" max="10"></label>
      </div>

      <label>Include patterns<textarea id="include-patterns" name="includePatterns" rows="2" placeholder="Optional; one pattern per line"></textarea></label>
      <label>Exclude patterns<textarea id="exclude-patterns" name="excludePatterns" rows="2" placeholder="One pattern per line"></textarea></label>

      <button id="save-button" type="submit">Save setup</button>
    </form>

    <section class="crawl-panel" aria-labelledby="crawl-heading">
      <h2 id="crawl-heading">Crawl control</h2>
      <p id="crawl-summary">No active crawl.</p>
      <div class="control-grid">
        <button id="create-button" type="button">Create</button>
        <button id="start-button" type="button">Start</button>
        <button id="pause-button" type="button">Pause</button>
        <button id="resume-button" type="button">Resume</button>
        <button id="cancel-button" type="button">Cancel</button>
      </div>
    </section>

    <p id="status" class="status" role="status" aria-live="polite">Connecting…</p>
    <button id="dashboard-button" class="secondary" type="button">Open dashboard</button>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
